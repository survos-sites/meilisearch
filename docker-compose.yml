name: meilisearch

services:
  meilisearch:
    build: .
    image: survos/meilisearch:local
    container_name: survos_meilisearch
    restart: unless-stopped
    # Bounded at the container as well as inside the process, matching how elasticsearch is
    # configured in ~/sites/docker (mem_limit: 2g alongside -Xmx1g). MEILI_MAX_INDEXING_MEMORY
    # below is Meilisearch's own budget for one indexing task; this is the ceiling the kernel
    # enforces on everything the process does, which is the part that was missing when it got
    # OOM-killed. Two limits, because the process's opinion of its budget and the machine's
    # opinion of it are different things and only one of them is binding.
    mem_limit: ${MEILI_MEM_LIMIT:-3g}
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?Run bin/run.sh to create the local secret}
      # Bound the indexing budget, because Meilisearch cannot see that it is sharing.
      #
      # Left unset, it sizes its indexing memory from the RAM it believes it has — which inside
      # podman is the whole 8 GiB VM, the same VM running Postgres, Redis, RabbitMQ and everything
      # else. With MEILI_MAX_CONCURRENT_TASKS=4 that over-commits by design, and the kernel
      # resolves it: pooling a chunked newspaper into a combined index (115,644 small documents,
      # ~0.1 GB of JSON — not a large push) got the container OOM-killed after 1,309 documents,
      # taking the whole instance and its other 22 indexes offline until the restart policy
      # noticed. The payload was never the problem; the budget was.
      #
      # Host-specific, so it belongs here rather than in the image.
      MEILI_MAX_INDEXING_MEMORY: ${MEILI_MAX_INDEXING_MEMORY:-2GiB}
      MEILI_MAX_INDEXING_THREADS: ${MEILI_MAX_INDEXING_THREADS:-2}
    ports:
      - "7700:7700"
    volumes:
      - ${MEILI_STORAGE_ROOT:?Set MEILI_STORAGE_ROOT}/data:/meili_data
      - ${MEILI_STORAGE_ROOT:?Set MEILI_STORAGE_ROOT}/dumps:/meili_dumps
      - ${MEILI_STORAGE_ROOT:?Set MEILI_STORAGE_ROOT}/tmp:/meili_tmp
